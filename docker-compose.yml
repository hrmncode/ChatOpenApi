services:
  app:
    build: .
    container_name: chatopenapi
    # host network so 127.0.0.1 inside the container reaches the host's
    # localhost (9Router, Ollama, etc.). No port mapping needed.
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
